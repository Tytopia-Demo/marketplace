name: Pint Tests

on: [push, pull_request]

permissions:
  contents: read

# Optimize runner allocation by cancelling outdated workflow runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pint_tests:
    runs-on: ${{ matrix.operating-systems }}
    timeout-minutes: 10

    strategy:
      matrix:
        # Lightweight runner for code style checks
        operating-systems: [ubuntu-latest]
        php-versions: ['8.3']

    name: PHP ${{ matrix.php-versions }} test on ${{ matrix.operating-systems }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pint
        run: composer global require laravel/pint
        env:
          COMPOSER_HOME: ${{ runner.temp }}/composer

      - name: Run Pint
        run: ${{ runner.temp }}/composer/vendor/bin/pint --test
